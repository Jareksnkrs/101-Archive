<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>101 Archive</title>

  <style>
    :root {
      --white: #f6f6f3;
      --soft-white: rgba(246, 246, 243, 0.72);
      --muted: rgba(246, 246, 243, 0.42);
      --line: rgba(246, 246, 243, 0.12);
      --card: rgba(15, 15, 15, 0.78);
      --input: rgba(255, 255, 255, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #000;
      color: var(--white);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    .background-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -3;
    }

    .background-overlay {
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(
          circle at 50% 30%,
          rgba(0, 0, 0, 0.18) 0%,
          rgba(0, 0, 0, 0.72) 75%
        ),
        rgba(0, 0, 0, 0.26);
      backdrop-filter: blur(2px);
    }

    .page {
      width: 100%;
      min-height: 100vh;
      padding: 40px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .assistant-layout {
      width: min(620px, 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* AVATAR */
    .avatar-area {
      height: 155px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
    }

    .avatar {
      width: 118px;
      height: 118px;
      object-fit: contain;
      border-radius: 50%;
      filter: drop-shadow(0 16px 30px rgba(0, 0, 0, 0.58));
      animation: idle 5.8s ease-in-out infinite;
      transition: transform 0.3s ease, filter 0.3s ease;
      will-change: transform;
    }

    /*
      Como el avatar es un PNG, esta animación da sensación
      de que está mirando o esperando, moviendo ligeramente
      toda la imagen.
    */
    @keyframes idle {
      0%,
      100% {
        transform: translateX(0) translateY(0) rotate(0deg);
      }

      17% {
        transform: translateX(-5px) translateY(1px) rotate(-1deg);
      }

      32% {
        transform: translateX(-5px) translateY(1px) rotate(-1deg);
      }

      48% {
        transform: translateX(5px) translateY(0) rotate(1deg);
      }

      63% {
        transform: translateX(5px) translateY(0) rotate(1deg);
      }

      80% {
        transform: translateX(0) translateY(-2px) rotate(0deg);
      }
    }

    .avatar.is-speaking {
      animation: speaking 0.3s ease-in-out infinite alternate;
      filter:
        drop-shadow(0 16px 30px rgba(0, 0, 0, 0.58))
        drop-shadow(0 0 22px rgba(255, 255, 255, 0.2));
    }

    @keyframes speaking {
      from {
        transform: translateY(0) scale(1);
      }

      to {
        transform: translateY(-3px) scale(1.035);
      }
    }

    /* CHAT */
    .chat-card {
      width: 100%;
      height: min(485px, 56vh);
      min-height: 380px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 28px 85px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(18px);
    }

    .chat-header {
      min-height: 62px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 22px;
      border-bottom: 1px solid var(--line);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #c2ffd5;
      box-shadow: 0 0 12px rgba(194, 255, 213, 0.9);
      animation: status-pulse 2s ease-in-out infinite;
    }

    @keyframes status-pulse {
      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.45;
        transform: scale(0.8);
      }
    }

    .chat-title {
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 2.4px;
      text-transform: uppercase;
    }

    .chat-messages {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
      padding: 22px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.18) transparent;
    }

    .chat-messages::-webkit-scrollbar {
      width: 5px;
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.16);
      border-radius: 999px;
    }

    .message {
      max-width: 82%;
      padding: 12px 15px;
      border-radius: 15px;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message.assistant {
      align-self: flex-start;
      color: var(--white);
      background: rgba(255, 255, 255, 0.055);
      border: 1px solid rgba(255, 255, 255, 0.075);
      border-bottom-left-radius: 4px;
    }

    .message.user {
      align-self: flex-end;
      color: rgba(255, 255, 255, 0.84);
      background: rgba(255, 255, 255, 0.115);
      border-bottom-right-radius: 4px;
    }

    .typing {
      width: fit-content;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 16px;
    }

    .typing span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.56);
      animation: typing-dot 1.1s ease-in-out infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes typing-dot {
      0%,
      100% {
        opacity: 0.24;
        transform: translateY(0);
      }

      50% {
        opacity: 1;
        transform: translateY(-3px);
      }
    }

    .chat-form {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 15px 18px;
      border-top: 1px solid var(--line);
      background: rgba(0, 0, 0, 0.12);
    }

    .chat-input {
      width: 100%;
      min-width: 0;
      padding: 13px 16px;
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 12px;
      outline: none;
      color: var(--white);
      background: var(--input);
      font: inherit;
      font-size: 14px;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .chat-input::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }

    .chat-input:focus {
      border-color: rgba(255, 255, 255, 0.28);
      background: rgba(255, 255, 255, 0.085);
    }

    .send-button {
      width: 46px;
      height: 46px;
      flex: 0 0 46px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      color: var(--white);
      background: rgba(255, 255, 255, 0.1);
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .send-button:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.18);
      transform: translateX(2px);
    }

    .send-button:disabled,
    .chat-input:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .enter-archive {
      position: fixed;
      right: 42px;
      bottom: 30px;
      z-index: 5;
      color: rgba(255, 255, 255, 0.45);
      font-size: 11px;
      letter-spacing: 2.5px;
      text-decoration: none;
      text-transform: uppercase;
      transition: color 0.2s ease, transform 0.2s ease;
    }

    .enter-archive:hover {
      color: var(--white);
      transform: translateX(4px);
    }

    @media (max-width: 600px) {
      .page {
        padding: 24px 16px;
        align-items: center;
      }

      .avatar-area {
        height: 126px;
        margin-bottom: 12px;
      }

      .avatar {
        width: 98px;
        height: 98px;
      }

      .chat-card {
        height: 58vh;
        min-height: 365px;
        border-radius: 18px;
      }

      .chat-messages {
        padding: 16px;
      }

      .message {
        max-width: 88%;
        font-size: 13px;
      }

      .enter-archive {
        display: none;
      }
    }
  </style>
</head>

<body>
  <video class="background-video" autoplay loop muted playsinline>
    <source src="video.mp4" type="video/mp4" />
  </video>

  <div class="background-overlay"></div>

  <main class="page">
    <section class="assistant-layout" aria-label="Asistente de 101 Archive">
      <div class="avatar-area">
        <img
          id="avatar"
          class="avatar"
          src="download.png"
          alt="Avatar de 101 Archive"
        />
      </div>

      <div class="chat-card">
        <header class="chat-header">
          <span class="status-dot" aria-hidden="true"></span>
          <span class="chat-title">101 Archive · Assistant</span>
        </header>

        <div id="chat-messages" class="chat-messages" aria-live="polite">
          <div class="message assistant">
            Hola. Soy el asistente de 101 Archive. ¿En qué puedo ayudarte?
          </div>
        </div>

        <form id="chat-form" class="chat-form">
          <input
            id="chat-input"
            class="chat-input"
            type="text"
            placeholder="Escribe un mensaje..."
            autocomplete="off"
            maxlength="1000"
            aria-label="Tu mensaje"
          />
          <button
            id="send-button"
            class="send-button"
            type="submit"
            aria-label="Enviar mensaje"
          >
            ↑
          </button>
        </form>
      </div>
    </section>
  </main>

  <a class="enter-archive" href="#">Enter Archive →</a>

  <script>
    const form = document.getElementById("chat-form");
    const input = document.getElementById("chat-input");
    const sendButton = document.getElementById("send-button");
    const messages = document.getElementById("chat-messages");
    const avatar = document.getElementById("avatar");

    // Guarda hasta 10 mensajes anteriores para que el asistente
    // mantenga el contexto durante esta visita.
    const conversation = [];

    function scrollToBottom() {
      messages.scrollTop = messages.scrollHeight;
    }

    function addMessage(text, role) {
      const element = document.createElement("div");
      element.className = `message ${role}`;
      element.textContent = text;
      messages.appendChild(element);
      scrollToBottom();
      return element;
    }

    function addTypingIndicator() {
      const element = document.createElement("div");
      element.id = "typing-indicator";
      element.className = "message assistant typing";
      element.innerHTML = "<span></span><span></span><span></span>";
      messages.appendChild(element);
      scrollToBottom();
    }

    function removeTypingIndicator() {
      document.getElementById("typing-indicator")?.remove();
    }

    function setLoading(isLoading) {
      input.disabled = isLoading;
      sendButton.disabled = isLoading;

      if (isLoading) {
        avatar.classList.add("is-speaking");
      } else {
        avatar.classList.remove("is-speaking");
      }
    }

    async function typeResponse(element, text) {
      avatar.classList.add("is-speaking");

      const speed = 16;

      for (let index = 0; index < text.length; index += 1) {
        element.textContent += text[index];
        scrollToBottom();

        await new Promise((resolve) => {
          window.setTimeout(resolve, speed);
        });
      }

      avatar.classList.remove("is-speaking");
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const userMessage = input.value.trim();

      if (!userMessage) {
        return;
      }

      addMessage(userMessage, "user");
      conversation.push({
        role: "user",
        content: userMessage,
      });

      input.value = "";
      setLoading(true);
      addTypingIndicator();

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            messages: conversation.slice(-10),
          }),
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "No se pudo obtener una respuesta.");
        }

        removeTypingIndicator();

        const reply = data.reply;
        const assistantMessage = addMessage("", "assistant");

        await typeResponse(assistantMessage, reply);

        conversation.push({
          role: "assistant",
          content: reply,
        });
      } catch (error) {
        console.error(error);
        removeTypingIndicator();

        addMessage(
          "Ahora mismo no puedo responder. Prueba de nuevo en unos segundos.",
          "assistant"
        );
      } finally {
        setLoading(false);
        input.focus();
      }
    });
  </script>
</body>
</html>
