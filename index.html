<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>101 Archive</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Fondo del Ojo WebGL -->
    <div id="eye-bg">
        <canvas id="eye-canvas"></canvas>
    </div>

    <!-- Pantalla de Bloqueo -->
    <div id="lock-screen">
        <div class="gate-box">
            <span class="trust-label">Trust Curiosity</span>
            <div class="input-wrap">
                <input
                    class="pw-input"
                    id="pw-input"
                    type="password"
                    placeholder="· · · · · · · ·"
                    autocomplete="off"
                    spellcheck="false"
                />
            </div>
            <div class="error-msg" id="error-msg"></div>
            <button class="enter-btn" id="enter-btn">Enter</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
